# Bild bauen und nach ghcr.io schieben: nur auf einen Tag v* oder von Hand (Actions, bilder, "Run workflow").
#   ghcr.io/<besitzer>/fyos-agent/runner   (runner/Dockerfile, Kontext runner/; der Installer zieht es mit FYOS_REGISTRY=ghcr.io/<besitzer>)
# Tags: der Name des Tags (v0.2.1) oder des Zweigs und die Commit-SHA; auf einen Tag ohne Bindestrich zusätzlich latest.
# Angemeldet wird mit dem Laufzeit-Token (packages: write), eigene Geheimnisse gibt es nicht.
name: bilder

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilder-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  runner:
    name: Bild runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bildname festlegen (ghcr.io verlangt Kleinbuchstaben)
        run: echo "BILD=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fyos-agent/runner" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner
          file: runner/Dockerfile
          push: true
          tags: |
            ${{ env.BILD }}:${{ github.ref_name }}
            ${{ env.BILD }}:${{ github.sha }}
            ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && format('{0}:latest', env.BILD) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/runner/README.en.md
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=FYOS-Agent Runner
            org.opencontainers.image.description=FYOS agent: durable runner on pi-durable with hub tools and approvals
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Runner im Bild prüfen (ohne Token verweigert er den Start nicht still, mit Token lädt die Konfiguration)
        run: |
          docker run --rm "${BILD}:${GITHUB_SHA}" node -e "import('/opt/fyos-agent/src/config.js').then(m => { const c = m.konfigurationLaden({}, { FYOS_RUNNER_CONTAINER: '1', FYOS_RUNNER_HOST: '0.0.0.0', FYOS_RUNNER_TOKEN: 'x'.repeat(32) }); if (m.bindungPruefen(c.pi_durable).fehler) process.exit(1); console.log('ok', c.pi_durable.port) })"
