# Bild bauen und nach ghcr.io schieben: nur auf einen Tag v* oder von Hand (Actions, bilder, "Run workflow"),
# nicht bei jedem Push. Es ist dasselbe Bild wie in der Gitea-CI (.gitea/workflows/ci.yml, Job bauen): openclaw/Dockerfile
# mit der Wurzel des Repos als Kontext.
#   ghcr.io/<besitzer>/fyos-agent/openclaw
# Der Name folgt dem Muster <registry>/fyos-agent/openclaw, das der Installer erwartet: FYOS_REGISTRY=ghcr.io/<besitzer>.
# Tags: der Name des Tags (v0.1.0) oder des Zweigs (main) und die Commit-SHA; auf einen Tag ohne Bindestrich zusätzlich latest.
# Angemeldet wird mit dem Laufzeit-Token (packages: write), eigene Geheimnisse gibt es nicht. Nur linux/amd64, wie in der Gitea-CI.
# Das Bild baut auf dem Upstream-Bild von OpenClaw (MIT). Dessen Beschriftung (Quelle, Lizenz, Titel, Adressen) erbt es,
# darum steht sie unten ausdrücklich neu: Die Lizenz des Bildes ist Apache-2.0 für den eigenen Teil und MIT für OpenClaw.
name: bilder

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilder-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bauen:
    name: Bild openclaw
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bildname festlegen (ghcr.io verlangt Kleinbuchstaben)
        run: echo "BILD=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fyos-agent/openclaw" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: openclaw/Dockerfile
          push: true
          tags: |
            ${{ env.BILD }}:${{ github.ref_name }}
            ${{ env.BILD }}:${{ github.sha }}
            ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && format('{0}:latest', env.BILD) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=Apache-2.0 AND MIT
            org.opencontainers.image.title=FYOS-Agent
            org.opencontainers.image.description=FYOS agent: OpenClaw with version-bound patches and behaviour plugins
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Upstream-Einstieg im Bild prüfen
        run: |
          docker run --rm --entrypoint sh "${BILD}:${GITHUB_SHA}" \
            -c 'command -v tini && command -v openclaw && ls /app | head -50 && python3 -c "import yaml"'
