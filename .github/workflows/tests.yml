# Prüfen bei jedem Push und jedem Pull Request: dieselben Tests wie die Gitea-CI (.gitea/workflows/ci.yml), aber ohne
# Bild-Bau. Das Bild baut bilder.yml, nur auf einen Tag v*.
# Keine Geheimnisse nötig, das Laufzeit-Token darf nur lesen. Die Actions sind auf einen Commit festgenagelt, die Version
# steht im Kommentar dahinter.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pruefen:
    name: Render-Tests und Plugin-Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Node 24 wie im Basisbild von OpenClaw; `node --test` kennt Muster mit ** ab Node 21.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Render-Tests
        run: |
          python -m pip install -q pytest pyyaml
          python -m pytest tests -q
      - name: Plugin-Tests
        run: node --test "plugins/**/*.test.mjs"

  geheimnisse:
    name: Geheimnisse und Sauberkeit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks als offizielles Release-Binary in fester Version. Die Prüfsumme ist die Zeile linux_x64 aus
      # gitleaks_8.30.1_checksums.txt desselben Release; passt sie nicht, bricht der Lauf ab.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ganze Historie für den zweiten gitleaks-Lauf
          persist-credentials: false
      - name: Sauberkeit (keine privaten Adressen, Konten, Geheimnisse)
        run: python3 tools/sauber.py .
      - name: gitleaks laden und prüfen
        run: |
          archiv="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archiv" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archiv"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archiv" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archiv" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks über den ganzen Baum
        run: gitleaks dir . --no-banner --redact --verbose
      - name: gitleaks über die Historie
        run: gitleaks git . --no-banner --redact --verbose
