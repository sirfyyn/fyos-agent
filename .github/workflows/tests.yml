# Checks on every push and pull request: the same tests as the Gitea CI (.gitea/workflows/ci.yml), without building the
# image. bilder.yml builds the image, only on a v* tag.
# No secrets needed; the runtime token is read-only. Actions are pinned to a commit, the version is in the comment.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pruefen:
    name: Runner-Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner (the only agent since 0.2.1) needs Node >= 22.19 and its own packages.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Runner-Tests
        working-directory: runner
        run: |
          npm ci --no-audit --no-fund
          npm test

  geheimnisse:
    name: Geheimnisse und Sauberkeit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks as the official release binary in a fixed version. The checksum is the linux_x64 line from
      # gitleaks_8.30.1_checksums.txt of the same release; if it does not match, the run stops.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ganze Historie für den zweiten gitleaks-Lauf
          persist-credentials: false
      - name: Cleanliness (no private addresses, accounts, secrets)
        run: python3 tools/sauber.py .
      - name: Download and verify gitleaks
        run: |
          archiv="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archiv" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archiv"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archiv" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archiv" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks over the whole tree
        run: gitleaks dir . --no-banner --redact --verbose
      - name: gitleaks over the history
        run: gitleaks git . --no-banner --redact --verbose
