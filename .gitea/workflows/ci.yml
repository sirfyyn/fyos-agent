# Checks on every push, builds the image on main.
# Repo variables: FYOS_RUNNER, FYOS_REGISTRY, optional FYOS_REGISTRY_HOSTS.
# Registry login: secrets REGISTRY_USER/REGISTRY_TOKEN (token with write:package; Gitea gives the runtime token
# GITEA_TOKEN no package rights). Without them the run tries the runtime token (packages: write).
# The agent is the runner (runner/).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Tested continuously: daily against the newest packages from the index, even without a commit.
  schedule:
    - cron: "11 5 * * *"

# Exactly one run per commit: branches through the PR run, main through the push run. If push and PR check the same
# commit, Gitea cancels the waiting second run, and the cancellation counts as a failure.
concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ${{ vars.FYOS_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - name: Cleanliness
        run: python3 tools/sauber.py .
      - name: Runner-Tests
        working-directory: runner
        run: |
          npm ci --no-audit --no-fund
          npm test

  bauen:
    needs: pruefen
    if: gitea.ref == 'refs/heads/main' && gitea.event_name == 'push'
    runs-on: ${{ vars.FYOS_RUNNER }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Log in
        run: |
          host="${FYOS_REGISTRY%%/*}"
          printf '%s' "$REGISTRY_TOKEN" | docker login "$host" -u "$REGISTRY_USER" --password-stdin
        env:
          FYOS_REGISTRY: ${{ vars.FYOS_REGISTRY }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER || gitea.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: runner
          file: runner/Dockerfile
          add-hosts: ${{ vars.FYOS_REGISTRY_HOSTS }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ vars.FYOS_REGISTRY }}/fyos-agent/runner:main
            ${{ vars.FYOS_REGISTRY }}/fyos-agent/runner:${{ gitea.sha }}
      - name: Check the runner in the image
        run: |
          bild="${{ vars.FYOS_REGISTRY }}/fyos-agent/runner:${{ gitea.sha }}"
          docker run --rm "$bild" node -e "import('/opt/fyos-agent/src/config.js').then(m => { const c = m.konfigurationLaden({}, { FYOS_RUNNER_CONTAINER: '1', FYOS_RUNNER_HOST: '0.0.0.0', FYOS_RUNNER_TOKEN: 'x'.repeat(32) }); if (m.bindungPruefen(c.pi_durable).fehler) process.exit(1); console.log('ok', c.pi_durable.port) })"
